<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log a Service Request</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 30px; }
        .box { max-width: 460px; margin: auto; background: #fff; padding: 24px; border-radius: 8px; }
        h1 { font-size: 22px; margin-top: 0; }
        label { display: block; margin-top: 14px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; margin-top: 6px; box-sizing: border-box; }
        button { margin-top: 18px; padding: 10px 18px; cursor: pointer; }
        a { display: inline-block; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Smart Municipal Service Request</h1>

        <!-- 4.3 form submits to the Servlet using the POST method -->
        <form action="submitRequest" method="post">

            <label for="citizenName">Citizen name</label>
            <input type="text" id="citizenName" name="citizenName" required>

            <label for="requestType">Request type</label>
            <select id="requestType" name="requestType" required>
                <option value="">-- Select a request type --</option>
                <option value="Water Leak">Water Leak</option>
                <option value="Pothole">Pothole</option>
                <option value="Street Light">Street Light</option>
                <option value="Electricity Fault">Electricity Fault</option>
                <option value="Refuse Collection">Refuse Collection</option>
            </select>

            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" required></textarea>

            <button type="submit">Submit Request</button>
        </form>

        <a href="viewRequests.jsp">View all service requests</a>
    </div>
</body>
</html>
